/* ---------- Prepositions / Conjunctions trainer engine ----------
   Generic engine driven entirely by data (PREP_MODULES/PREP_EXERCISES,
   CONJ_MODULES/CONJ_EXERCISES). Adding more exercises later = editing the
   Python data file, no changes needed here.
   Each module's exercise pool is auto-sliced into fixed-size Rounds so a
   session stays predictable no matter how large the pool grows.
   Routes:
     #prep                       -> hub (list of sub-modules)
     #prep/<modkey>                -> round list for that sub-module
     #prep/<modkey>/<roundNum>     -> exercise run for that round (1-based)
     #conj                       -> hub
     #conj/<modkey>                -> round list
     #conj/<modkey>/<roundNum>     -> exercise run
------------------------------------------------------------------- */
const ROUND_SIZE=8;
const TRAINER_SETS={
  prep:{title:'Prepositions Trainer', modules:PREP_MODULES, exercises:PREP_EXERCISES, backRoute:'prep', single:false},
  conj:{title:'Conjunctions Trainer', modules:CONJ_MODULES, exercises:CONJ_EXERCISES, backRoute:'conj', single:false},
  verbcase:{title:'Dativ-Akkusativ Word Order Trainer',
    modules:[{key:'main', label:'Dativ-Akkusativ Word Order Trainer', explain:VERBCASE_EXPLAIN}],
    exercises:{main:VERBCASE_EXERCISES}, backRoute:'/', single:true},
};
function renderTrainerHub(kind){
  const set=TRAINER_SETS[kind]; if(!set){renderHome();return}
  controls.style.display='none'; titleEl.innerHTML=esc(set.title)+'<span class="beta-badge">BETA</span>'; subEl.style.display='none';
  if(!set.modules.length){ out.innerHTML='<div class="empty">Coming soon.</div>'; return; }
  const cards=set.modules.map(m=>{
    const n=(set.exercises[m.key]||[]).length;
    return `<a class="trainer-card" href="#${kind}/${encodeURIComponent(m.key)}">
      <div class="tc-icon">${m.icon}</div>
      <div class="tc-title">${esc(m.label)}</div>
      <div class="tc-desc">${esc(m.desc)}</div>
      <div class="tc-count">${n} exercises</div>
    </a>`;
  }).join('');
  out.innerHTML=`<div class="page-head"><h2>${esc(set.title)}</h2><a class="btn ghost" href="#/">All words</a></div>
    <div class="trainer-grid">${cards}</div>`;
}
function trainerModLabel(kind,modKey){
  const set=TRAINER_SETS[kind]; const m=set.modules.find(x=>x.key===modKey);
  return m?m.label:modKey;
}
function roundCount(kind,modKey){
  const set=TRAINER_SETS[kind]; const n=(set.exercises[modKey]||[]).length;
  return Math.max(1, Math.ceil(n/ROUND_SIZE));
}
// deterministic slice: round N always contains the same exercises (order within
// the round is still shuffled at play-time), so "coverage" is guaranteed and
// stable even as the underlying array order in the data file doesn't change.
function roundSlice(kind,modKey,roundNum){
  const set=TRAINER_SETS[kind]; const pool=set.exercises[modKey]||[];
  const start=(roundNum-1)*ROUND_SIZE;
  return pool.slice(start, start+ROUND_SIZE);
}
function routeTrainer(kind,rest){
  const set=TRAINER_SETS[kind];
  if(set && set.single){
    // #verbcase -> round list; #verbcase/3 -> round 3 (no modKey segment in the URL)
    const parts=(rest||'').split('/').filter(Boolean);
    if(parts.length && /^\d+$/.test(parts[0])) renderTrainer(kind,'main',parseInt(parts[0],10));
    else renderRoundList(kind,'main');
    return;
  }
  const parts=rest.split('/');
  const modKey=decodeURIComponent(parts[0]);
  if(parts.length>1 && /^\d+$/.test(parts[1])){
    renderTrainer(kind, modKey, parseInt(parts[1],10));
  } else {
    renderRoundList(kind, modKey);
  }
}
function renderRoundList(kind,modKey){
  const set=TRAINER_SETS[kind]; if(!set){renderHome();return}
  controls.style.display='none';
  const label=trainerModLabel(kind,modKey);
  const heading=set.single?esc(set.title):(esc(set.title)+' &middot; '+esc(label));
  titleEl.innerHTML=heading+'<span class="beta-badge">BETA</span>'; subEl.style.display='none';
  const total=(set.exercises[modKey]||[]).length;
  const backHref=set.single?'#/':('#'+kind);
  const backLabel=set.single?'All words':esc(set.title);
  if(!total){ out.innerHTML=`<div class="page-head"><h2>${esc(label)}</h2><a class="btn ghost" href="${backHref}">${backLabel}</a></div><div class="empty">No exercises in this module yet.</div>`; return; }
  const rounds=roundCount(kind,modKey);
  const progress=(trainerProgress[kind]&&trainerProgress[kind][modKey])||{};
  const cards=[...Array(rounds).keys()].map(i=>{
    const rNum=i+1; const n=roundSlice(kind,modKey,rNum).length;
    const done=progress[rNum];
    const doneTag=done?`<div class="tc-count" style="color:#219150">&#10003; ${done.correct}/${done.total} last time</div>`:`<div class="tc-count">${n} exercises</div>`;
    return `<a class="trainer-card" href="#${kind}/${set.single?'':(encodeURIComponent(modKey)+'/')}${rNum}">
      <div class="tc-title">Round ${rNum}</div>
      <div class="tc-desc">Exercises ${i*ROUND_SIZE+1}&ndash;${i*ROUND_SIZE+n}</div>
      ${doneTag}
    </a>`;
  }).join('');
  const mod=set.modules.find(m=>m.key===modKey);
  const explainBlock=(mod&&mod.explain)?`<div class="explain-section">${mod.explain}</div>`:'';
  const pageTitle=set.single?esc(set.title):esc(label);
  out.innerHTML=`<div class="page-head"><h2>${pageTitle}</h2><a class="btn ghost" href="${backHref}">${backLabel}</a></div>
    ${explainBlock}
    <p style="color:#888;font-size:13.5px;margin:14px 4px 4px">${total} exercises in ${rounds} round${rounds>1?'s':''} of up to ${ROUND_SIZE}.</p>
    <div class="trainer-grid">${cards}</div>`;
}

let trainer=null; // {kind, modKey, roundNum, pool, order, pos, correct, incorrect, phase:'ask'|'answered', obPicked:[], clozeState}
let trainerProgress={}; // {kind:{modKey:{roundNum:{correct,total}}}} — in-memory only (resets on page reload)
function shuffleIdx(n){ const o=[...Array(n).keys()]; for(let i=o.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[o[i],o[j]]=[o[j],o[i]];} return o; }
function startTrainer(kind,modKey,roundNum){
  const pool=roundSlice(kind,modKey,roundNum);
  const order=shuffleIdx(pool.length);
  trainer={kind,modKey,roundNum,pool,order,pos:0,correct:0,incorrect:0,phase:'ask',obPicked:[],obBank:[],clozeState:null};
}
function recordRoundResult(kind,modKey,roundNum,correct,total){
  trainerProgress[kind]=trainerProgress[kind]||{};
  trainerProgress[kind][modKey]=trainerProgress[kind][modKey]||{};
  trainerProgress[kind][modKey][roundNum]={correct,total};
}
function renderTrainer(kind,modKey,roundNum){
  const set=TRAINER_SETS[kind]; if(!set){renderHome();return}
  controls.style.display='none';
  const label=trainerModLabel(kind,modKey);
  const heading=set.single?esc(set.title):(esc(set.title)+' &middot; '+esc(label));
  titleEl.innerHTML=heading+' &middot; Round '+roundNum+'<span class="beta-badge">BETA</span>'; subEl.style.display='none';
  if(!trainer||trainer.kind!==kind||trainer.modKey!==modKey||trainer.roundNum!==roundNum) startTrainer(kind,modKey,roundNum);
  const backHref=set.single?`#${kind}`:`#${kind}/${encodeURIComponent(modKey)}`;
  const roundHref=(n)=>set.single?`#${kind}/${n}`:`#${kind}/${encodeURIComponent(modKey)}/${n}`;
  if(!trainer.pool.length){ out.innerHTML='<div class="empty">No exercises in this round.</div>'; return; }
  if(trainer.pos>=trainer.order.length){
    const total=trainer.correct+trainer.incorrect;
    const pct=total?Math.round(trainer.correct/total*100):0;
    recordRoundResult(kind,modKey,roundNum,trainer.correct,total);
    const rounds=roundCount(kind,modKey);
    const nextRound=roundNum<rounds?`<a class="btn primary" href="${roundHref(roundNum+1)}">Round ${roundNum+1} &#8594;</a>`:'';
    out.innerHTML=`<div class="ex-wrap"><div class="qdone"><h2>&#127881; Round ${roundNum} fertig!</h2>
      <p style="color:#777;margin:8px 0 6px">${total} exercises completed.</p>
      <div class="score-row">
        <span class="score-pill ok">&#10003; ${trainer.correct} correct</span>
        <span class="score-pill no">&#10007; ${trainer.incorrect} incorrect</span>
      </div>
      <p style="color:#999;margin:10px 0 18px;font-size:13px">${pct}% correct</p>
      <div class="qbtns">${nextRound}<button class="btn ghost" id="retrainer">Nochmal</button>
      <a class="btn ghost" href="${backHref}">All rounds</a></div></div></div>`;
    $('#retrainer').onclick=()=>{startTrainer(kind,modKey,roundNum);renderTrainer(kind,modKey,roundNum)}; return;
  }
  const ex=trainer.pool[trainer.order[trainer.pos]];
  const pctBar=Math.round(trainer.pos/trainer.order.length*100);
  const header=`<div class="quiz-top"><span class="progress">${trainer.pos+1} / ${trainer.order.length} &middot; ${trainer.correct}&#10003; ${trainer.incorrect}&#10007;</span>
      <a class="btn ghost" href="${backHref}" style="padding:6px 12px">Exit</a></div>
    <div class="bar"><i style="width:${pctBar}%"></i></div>`;
  if(ex.type==='order') renderOrderExercise(ex,header);
  else if(ex.type==='cloze') renderClozeExercise(ex,header);
  else renderMcExercise(ex,header);
}
function renderMcExercise(ex,header){
  const answered=trainer.phase==='answered';
  const choicesHtml=ex.choices.map((c,i)=>{
    let cls='ex-choice';
    if(answered){
      if(c===ex.answer) cls+=' correct';
      else if(c===trainer.lastPick) cls+=' wrong';
    }
    return `<button class="${cls}" data-i="${i}" ${answered?'disabled':''}>${esc(c)}</button>`;
  }).join('');
  const note=answered?`<div class="ex-note ${trainer.lastOk?'ok':'no'}">${trainer.lastOk?'&#10003; Richtig! ':'&#10007; '}${esc(ex.note||'')}</div>`:'';
  const nextBtn=answered?`<div class="ob-check"><button class="btn primary" id="exNext">Weiter &#8594;</button></div>`:'';
  out.innerHTML=`<div class="ex-wrap">${header}<div class="ex-card">
      <div class="ex-prompt">${esc(ex.prompt)}</div>
      <div class="ex-choices">${choicesHtml}</div>
      ${note}${nextBtn}
    </div></div>`;
  if(!answered){
    out.querySelectorAll('.ex-choice').forEach(b=>b.addEventListener('click',()=>{
      const pick=ex.choices[+b.dataset.i];
      trainer.lastPick=pick; trainer.lastOk=(pick===ex.answer); trainer.phase='answered';
      if(trainer.lastOk) trainer.correct++; else trainer.incorrect++;
      renderTrainer(trainer.kind,trainer.modKey,trainer.roundNum);
    }));
  } else {
    $('#exNext').onclick=()=>{ trainer.pos++; trainer.phase='ask'; renderTrainer(trainer.kind,trainer.modKey,trainer.roundNum); };
  }
}
function renderOrderExercise(ex,header){
  const answered=trainer.phase==='answered';
  if(trainer.obBank.length===0 && trainer.obPicked.length===0 && !answered){
    trainer.obBank=shuffleIdx(ex.chunks.length).map(i=>ex.chunks[i]);
  }
  const answerSlots=trainer.obPicked.map((w,i)=>`<span class="ob-chunk" data-pick="${i}">${esc(w)}</span>`).join('');
  const bankChunks=trainer.obBank.map((w,i)=>`<span class="ob-chunk" data-bank="${i}">${esc(w)}</span>`).join('');
  let note='', nextBtn='';
  if(answered){
    const correctStr=ex.chunks.join(' ').replace(/ \./,'.');
    note=`<div class="ob-result ${trainer.lastOk?'ok':'no'}">${trainer.lastOk?'&#10003; Richtig!':'&#10007; Nicht ganz.'}</div>
          <div class="ob-correct-sentence">${esc(correctStr)}</div>
          <div class="ex-note">${esc(ex.note||'')}</div>`;
    nextBtn=`<div class="ob-check"><button class="btn primary" id="exNext">Weiter &#8594;</button></div>`;
  }
  const checkBtn=(!answered && trainer.obBank.length===0)
    ?`<div class="ob-check"><button class="btn primary" id="obCheck">Prüfen</button></div>`:'';
  out.innerHTML=`<div class="ex-wrap">${header}<div class="ex-card">
      <div class="ex-prompt" style="font-size:16px;color:#666">${esc(ex.prompt)}</div>
      <div class="ob-answer ${trainer.obPicked.length?'filled':''}" id="obAnswer">${answerSlots}</div>
      ${!answered?`<div class="ob-bank" id="obBank">${bankChunks}</div>`:''}
      ${checkBtn}${note}${nextBtn}
    </div></div>`;
  if(!answered){
    out.querySelectorAll('[data-bank]').forEach(el=>el.addEventListener('click',()=>{
      const i=+el.dataset.bank; trainer.obPicked.push(trainer.obBank[i]); trainer.obBank.splice(i,1);
      renderTrainer(trainer.kind,trainer.modKey,trainer.roundNum);
    }));
    out.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click',()=>{
      const i=+el.dataset.pick; trainer.obBank.push(trainer.obPicked[i]); trainer.obPicked.splice(i,1);
      renderTrainer(trainer.kind,trainer.modKey,trainer.roundNum);
    }));
    const chk=$('#obCheck');
    if(chk) chk.onclick=()=>{
      const given=trainer.obPicked.join(' ');
      const correct=ex.chunks.join(' ');
      trainer.lastOk=(given===correct); trainer.phase='answered';
      if(trainer.lastOk) trainer.correct++; else trainer.incorrect++;
      renderTrainer(trainer.kind,trainer.modKey,trainer.roundNum);
    };
  } else {
    $('#exNext').onclick=()=>{ trainer.pos++; trainer.phase='ask'; trainer.obPicked=[]; trainer.obBank=[]; renderTrainer(trainer.kind,trainer.modKey,trainer.roundNum); };
  }
}
function renderClozeExercise(ex,header){
  const answered=trainer.phase==='answered';
  // clozeState: array parallel to blanks, each entry = picked choice string or null
  const blanks=ex.segments.filter(s=>typeof s!=='string');
  if(!trainer.clozeState || trainer.clozeState.length!==blanks.length){
    trainer.clozeState=blanks.map(()=>null);
  }
  let blankIdx=-1;
  const bodyHtml=ex.segments.map(seg=>{
    if(typeof seg==='string') return esc(seg).replace(/\n/g,'<br>');
    blankIdx++;
    const bi=blankIdx;
    const picked=trainer.clozeState[bi];
    if(!answered){
      const opts=seg.choices.map(c=>`<option value="${esc(c)}" ${picked===c?'selected':''}>${esc(c)}</option>`).join('');
      return `<select class="cloze-blank" data-blank="${bi}"><option value="" ${picked?'':'selected'} disabled>&mdash;</option>${opts}</select>`;
    } else {
      const ok=picked===seg.answer;
      const cls=ok?'cloze-blank-result ok':'cloze-blank-result no';
      const shown=ok?esc(picked):`${esc(picked||'—')} &#8594; <b>${esc(seg.answer)}</b>`;
      return `<span class="${cls}">${shown}</span>`;
    }
  }).join('');
  const allFilled=trainer.clozeState.every(v=>v!==null);
  const checkBtn=(!answered && allFilled)?`<div class="ob-check"><button class="btn primary" id="clozeCheck">Prüfen</button></div>`:'';
  let resultBlock='';
  if(answered){
    const nOk=trainer.clozeState.filter((v,i)=>v===blanks[i].answer).length;
    resultBlock=`<div class="ob-result ${nOk===blanks.length?'ok':'no'}">${nOk} / ${blanks.length} richtig</div>
      ${ex.note?`<div class="ex-note">${esc(ex.note)}</div>`:''}
      <div class="ob-check"><button class="btn primary" id="exNext">Weiter &#8594;</button></div>`;
  }
  out.innerHTML=`<div class="ex-wrap">${header}<div class="ex-card">
      ${ex.title?`<div class="cloze-title">${esc(ex.title)}</div>`:''}
      <div class="cloze-body">${bodyHtml}</div>
      ${checkBtn}${resultBlock}
    </div></div>`;
  if(!answered){
    out.querySelectorAll('.cloze-blank').forEach(sel=>sel.addEventListener('change',()=>{
      trainer.clozeState[+sel.dataset.blank]=sel.value||null;
      renderTrainer(trainer.kind,trainer.modKey,trainer.roundNum);
    }));
    const chk=$('#clozeCheck');
    if(chk) chk.onclick=()=>{
      let nOk=0;
      trainer.clozeState.forEach((v,i)=>{ if(v===blanks[i].answer) nOk++; });
      trainer.correct+=nOk; trainer.incorrect+=(blanks.length-nOk);
      trainer.phase='answered';
      renderTrainer(trainer.kind,trainer.modKey,trainer.roundNum);
    };
  } else {
    $('#exNext').onclick=()=>{ trainer.pos++; trainer.phase='ask'; trainer.clozeState=null; renderTrainer(trainer.kind,trainer.modKey,trainer.roundNum); };
  }
}

/* ---------- router ----------
   #/                                -> home (all words)
   #lektion/<lek>                     -> words of one lesson
   #quiz/lektion/<lek>                -> quiz, one lesson (all word types)
   #quiz/<typeroute>/all              -> quiz, one word type, all lessons
   #quiz/<typeroute>/<lek>            -> quiz, one word type, one lesson
   #artikel/... (same scope forms)    -> Der, Die oder Das trainer (nouns only)
   #noun/all | #noun/<lek>            -> nouns (all or one lesson)
   #adj/all  | #adj/<lek>             -> adjectives (all or one lesson)
   #verb/all | #verb/<lek>            -> verbs (all or one lesson)
------------------------------------------------------------- */
const TYPE_ROUTES=new Set(WTYPES.map(w=>w.route));
function renderLektionRoute(rest){
  if(rest.indexOf('level/')===0) renderLektionLevel(decodeURIComponent(rest.slice(6)));
  else renderLesson(rest);
}
function resetSessions(){ quiz=null; artikel=null; trainer=null; }
function route(){
  const h=decodeURIComponent(location.hash).replace(/^#/,'');
  openDrawer(false);
  if(h.indexOf('lektion/')===0){ resetSessions(); renderLektionRoute(h.slice(8)); }
  else if(h.indexOf('quiz/')===0){ artikel=null; trainer=null; renderQuiz(h.slice(5)); }
  else if(h.indexOf('artikel/')===0){ quiz=null; trainer=null; renderArtikel(h.slice(8)); }
  else if(h==='prep'||h==='conj'){ resetSessions(); renderTrainerHub(h); }
  else if(h.indexOf('prep/')===0){ quiz=null; artikel=null; routeTrainer('prep', h.slice(5)); }
  else if(h.indexOf('conj/')===0){ quiz=null; artikel=null; routeTrainer('conj', h.slice(5)); }
  else if(h==='verbcase'||h.indexOf('verbcase/')===0){ quiz=null; artikel=null; routeTrainer('verbcase', h.slice(9)); }
  else {
    const m=h.match(/^([a-z]+)\/(.+)$/);
    if(m && TYPE_ROUTES.has(m[1])){ resetSessions(); renderType(m[1], m[2]); }
    else { resetSessions(); renderHome(); }
  }
  markActive();
  window.scrollTo(0,0);
}
q.addEventListener('input',()=>{state.q=q.value; rerenderCurrent();});
sortSel.addEventListener('change',()=>{state.sort=sortSel.value; rerenderCurrent();});
function rerenderCurrent(){
  // search/sort only affect list views (home/lesson/type/level); quiz & artikel ignore them
  const h=decodeURIComponent(location.hash).replace(/^#/,'');
  if(h.indexOf('lektion/')===0) renderLektionRoute(h.slice(8));
  else{
    const m=h.match(/^([a-z]+)\/(.+)$/);
    if(m && TYPE_ROUTES.has(m[1])) renderType(m[1], m[2]);
    else renderHome();
  }
}
window.addEventListener('hashchange',route);
route();
</script>
