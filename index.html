 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}

 h1{font-size:20px;letter-spacing:.2px}

 .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:11px}
 select,input{font-size:14px;padding:8px 10px;border:1px solid #d8d5ce;border-radius:8px;background:#fff;color:var(--ink)}

 .count{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap}

    border-bottom:1px solid var(--line);padding-bottom:6px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:13px}
 .card{border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden;
   box-shadow:0 1px 2px rgba(0,0,0,.03);transition:transform .08s ease, box-shadow .08s ease}
 .card:hover{transform:translateY(-2px);box-shadow:0 5px 16px rgba(0,0,0,.08)}
 .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f0eee9;display:block}
 .ph{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
   font-size:34px;font-weight:800;color:#fff;letter-spacing:.5px}
 .ph.der{background:linear-gradient(135deg,#5dade2,#2e86c1)}
 .ph.die{background:linear-gradient(135deg,#ec7063,#cb4335)}
 .ph.das{background:linear-gradient(135deg,#58d68d,#229954)}
 .ph.none{background:linear-gradient(135deg,#aeb6bf,#808b96)}
 .body{padding:9px 11px 12px}
 .word{font-size:17px;font-weight:700;line-height:1.2}
 .word .art{font-weight:800}
 .spk{border:none;background:#f0eee9;color:#555;border-radius:6px;cursor:pointer;
   font-size:13px;padding:2px 7px;margin-left:6px;vertical-align:middle}
 .spk:hover{background:#e4e1da}
 .wrow{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
 .word.der,.word.der .art{color:var(--der)} .word.die,.word.die .art{color:var(--die)}
 .word.das,.word.das .art{color:var(--das)} .word.none{color:var(--ink)}
 .tr{font-size:13.5px;color:#444;margin-top:3px;line-height:1.25}
 .es{font-size:12px;color:var(--muted);font-style:italic;margin-top:2px}
 .tags{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
 .lek{font-size:10.5px;color:#6b7280;background:#f0eee9;border-radius:20px;padding:2px 8px}
 .wt{font-size:9.5px;font-weight:700;color:#fff;border-radius:4px;padding:2px 6px}
 .wt.Noun{background:#2196F3}.wt.Verb{background:#4CAF50}.wt.Adjective{background:#FFC107;color:#333}
 .wt.Adverb{background:#FF5722}.wt.Phrase{background:#9C27B0}.wt.Expression{background:#E91E63}
 footer{max-width:1200px;margin:0 auto;padding:18px;color:var(--muted);font-size:11.5px;text-align:center;
   border-top:1px solid var(--line)}
 .empty{padding:40px;text-align:center;color:var(--muted)}

const out=document.getElementById('out'), q=document.getElementById('q'),
      lekSel=document.getElementById('lek'), sortSel=document.getElementById('sort'),
      countEl=document.getElementById('count');
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
// populate lesson dropdown in newest-first order
[...new Set(DATA.map(r=>r.lek))].sort((a,b)=>(rank(a)-rank(b)))
  .forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=l;lekSel.appendChild(o)});
function rank(l){const r=DATA.find(x=>x.lek===l);return r?r.lekRank:999}
function gc(a){return a==='der'?'der':a==='die'?'die':a==='das'?'das':'none'}
function card(r){
  const g=gc(r.article);
  const img=r.src?`<img class="thumb" loading="lazy" src="${esc(r.src)}" alt="">`
                 :`<div class="ph ${g}">${esc(r.article||r.word.slice(0,1))}</div>`;
  const art=r.article?`<span class="art">${esc(r.article)}</span> `:'';
  const say=((r.article?r.article+' ':'')+r.word);
  return `<div class="card">${img}<div class="body">
    <div class="wrow"><div class="word ${g}">${art}${esc(r.word)}</div>`
       +`<button class="spk" data-say="${esc(say)}" title="Aussprache">🔊</button></div>
    <div class="tr">${esc(r.tr)}</div>
    ${r.es?`<div class="es">${esc(r.es)}</div>`:''}
    <div class="tags"><span class="lek">${esc(r.lek)}</span><span class="wt ${esc(r.wt)}">${esc(r.wt)}</span></div>
  </div></div>`;
}
function render(){
  const term=q.value.trim().toLowerCase(), lekF=lekSel.value, mode=sortSel.value;
  let rows=DATA.filter(r=>{
    if(lekF && r.lek!==lekF) return false;
    if(!term) return true;
    return (r.word+' '+r.tr+' '+(r.es||'')).toLowerCase().includes(term);
  });
  rows.sort((a,b)=>{
    if(mode==='lek_new') return a.lekRank-b.lekRank || a.word.localeCompare(b.word);
    if(mode==='lek_old') return b.lekRank-a.lekRank || a.word.localeCompare(b.word);
    return a.word.localeCompare(b.word);
  });
  countEl.textContent=rows.length+' words';
  let h='';
  if((mode==='lek_new'||mode==='lek_old') && !lekF){
    let cur=null;
    for(const r of rows){ if(r.lek!==cur){ if(cur!==null)h+='</div>'; cur=r.lek;
      h+=`<h2>${esc(cur)}</h2><div class="grid">`;} h+=card(r);}
    if(cur!==null)h+='</div>';
  } else { h='<div class="grid">'+rows.map(card).join('')+'</div>'; }
  out.innerHTML=h||'<div class="empty">No words match.</div>';
}
let DEVOICE=null;
function pickVoice(){const v=speechSynthesis.getVoices();
  DEVOICE=v.find(x=>/de(-|_)?/i.test(x.lang))||null;}
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
out.addEventListener('click',e=>{const b=e.target.closest('.spk');if(!b)return;
  if(!('speechSynthesis'in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(b.dataset.say);
  u.lang='de-DE';if(DEVOICE)u.voice=DEVOICE;u.rate=.9;speechSynthesis.speak(u);});
[q,lekSel,sortSel].forEach(el=>{el.addEventListener('input',render);el.addEventListener('change',render)});
render();
</script>
