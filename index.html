<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>German Picture Dictionary</title>
<style>
 :root{--der:#3498db;--die:#e74c3c;--das:#2ecc71;--none:#f1c40f;
   --ink:#1f2937;--muted:#8a8f98;--line:#e7e5e0;--paper:#fff;--bg:#f6f4ef}
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
 /* header */
 header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);
   border-bottom:1px solid var(--line);padding:11px 16px;display:flex;align-items:center;gap:12px}
 .burger{font-size:20px;line-height:1;background:#efece6;border:1px solid var(--line);cursor:pointer;
   color:#444;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
   flex-shrink:0}
 .burger:hover{background:#e4e1da}
 .htext h1{font-size:18px;letter-spacing:.2px}
 .htext .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
 /* controls bar (grid views) */
 .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 16px 0;max-width:1200px;margin:0 auto}
 select,input{font-size:14px;padding:8px 10px;border:1px solid #d8d5ce;border-radius:8px;background:#fff;color:var(--ink)}
 input#q{flex:1;min-width:160px}
 .count{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap}
 main{padding:8px 16px 48px;max-width:1200px;margin:0 auto}
 h2.grp{margin:20px 4px 12px;font-size:15px;color:#555;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px}
 /* grid + cards */
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:13px}
 .card{border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03);
   transition:transform .08s,box-shadow .08s}
 .card:hover{transform:translateY(-2px);box-shadow:0 5px 16px rgba(0,0,0,.08)}
 .card.der{background:#eef5fc;border-color:#d5e6f6}
 .card.die{background:#fdeeec;border-color:#f4d6d2}
 .card.das{background:#eafaf1;border-color:#cdeedd}
 .card.none{background:#fff;border-color:var(--line)}
 .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f0eee9;display:block}
 .ph{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#fff}
 .ph.der{background:linear-gradient(135deg,#5dade2,#2e86c1)}.ph.die{background:linear-gradient(135deg,#ec7063,#cb4335)}
 .ph.das{background:linear-gradient(135deg,#58d68d,#229954)}.ph.none{background:linear-gradient(135deg,#f5d76e,#d4ac0d)}
 .body{padding:9px 11px 12px}
 .wrow{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
 .word{font-size:17px;font-weight:700;line-height:1.2}.word .art{font-weight:800}
 .word.der,.word.der .art{color:var(--der)}.word.die,.word.die .art{color:var(--die)}
 .word.das,.word.das .art{color:var(--das)}.word.none{color:var(--ink)}
 .spk{border:none;background:rgba(0,0,0,.05);color:#555;border-radius:6px;cursor:pointer;font-size:13px;padding:2px 7px;margin-left:6px}
 .spk:hover{background:rgba(0,0,0,.1)}
 .tr{font-size:13.5px;color:#444;margin-top:3px;line-height:1.25}
 .es{font-size:12px;color:var(--muted);font-style:italic;margin-top:2px}
 .tags{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
 .lek{font-size:10.5px;color:#6b7280;background:rgba(0,0,0,.05);border-radius:20px;padding:2px 8px}
 .wt{font-size:9.5px;font-weight:700;color:#fff;border-radius:4px;padding:2px 6px}
 .wt.Noun{background:#2196F3}.wt.Verb{background:#4CAF50}.wt.Adjective{background:#FFC107;color:#333}
 .wt.Adverb{background:#FF5722}.wt.Phrase{background:#9C27B0}.wt.Expression{background:#E91E63}
 /* drawer */
 .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:.2s;z-index:30}
 .overlay.open{opacity:1;visibility:visible}
 .drawer{position:fixed;top:0;left:0;height:100%;width:280px;background:#fff;border-right:1px solid var(--line);
   transform:translateX(-100%);transition:transform .22s ease;z-index:40;overflow-y:auto;box-shadow:2px 0 18px rgba(0,0,0,.06)}
 .drawer.open{transform:translateX(0)}
 .drawer .brand{padding:16px 18px;font-weight:800;font-size:16px;border-bottom:1px solid var(--line)}
 .drawer .brand span{color:var(--der)}
 .drawer nav{padding:8px 8px 24px}
 .nav-home{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;color:var(--ink);
   text-decoration:none;font-size:14px;font-weight:600;margin-bottom:6px}
 .nav-home:hover{background:#f2efe9}
 .mod-flat-link{display:block;padding:11px 12px;font-size:14.5px;font-weight:700;color:#333;
   text-decoration:none;border-radius:8px;margin-bottom:4px}
 .mod-flat-link:hover{background:#f2efe9}
 .mod-flat-link.active{background:#eaf2fb;color:#2e6da4}
 /* accordion module */
 .mod{border-radius:10px;overflow:hidden;margin-bottom:4px}
 .mod-head{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;
   cursor:pointer;padding:11px 12px;font-size:14.5px;font-weight:700;color:#333;border-radius:8px;text-align:left}
 .mod-head:hover{background:#f2efe9}
 .mod-head .chev{font-size:11px;color:var(--muted);transition:transform .18s ease}
 .mod.open .mod-head .chev{transform:rotate(90deg)}
 .mod-body{max-height:0;overflow:hidden;transition:max-height .22s ease}
 .mod.open .mod-body{max-height:1400px}
 .mod-list{padding:2px 6px 8px}
 .sub-link{display:flex;justify-content:space-between;align-items:center;padding:7px 14px 7px 26px;border-radius:8px;
   color:#4b5563;text-decoration:none;font-size:13px}
 .sub-link:hover{background:#f2efe9}
 .sub-link.all{font-weight:700;color:#1f2937}
 .sub-link .n{color:var(--muted);font-size:11px}
 .sub-link.active,.nav-home.active{background:#eaf2fb;color:#2e6da4}
 /* level tier (A1/A2/... nested inside each module) */
 .lvl{border-radius:8px;overflow:hidden;margin:1px 4px}
 .lvl-head{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;
   cursor:pointer;padding:9px 12px 9px 22px;font-size:13.5px;font-weight:700;color:#4b5563;border-radius:8px;text-align:left}
 .lvl-head:hover{background:#f2efe9}
 .lvl-head .n{color:var(--muted);font-size:11px;font-weight:600;margin-left:8px;margin-right:6px}
 .lvl-head .chev{font-size:10px;color:var(--muted);transition:transform .18s ease;margin-left:auto}
 .lvl.open>.lvl-head .chev{transform:rotate(90deg)}
 .lvl-body{max-height:0;overflow:hidden;transition:max-height .2s ease}
 .lvl.open>.lvl-body{max-height:900px}
 .lvl .sub-link{padding-left:38px}
 /* lesson/type header + quiz button */
 .page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 4px 6px}
 .page-head h2{font-size:20px}
 .btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:10px;cursor:pointer;
   font-size:14px;font-weight:700;padding:10px 16px;text-decoration:none}
 .btn.primary{background:var(--der);color:#fff}.btn.primary:hover{background:#2e86c1}
 .btn.ghost{background:#efece6;color:#444}.btn.ghost:hover{background:#e4e1da}
 .btn.amber{background:#e67e22;color:#fff}.btn.amber:hover{background:#d35400}
 /* artikel trainer */
 .art-choices{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
 .art-btn{border:2px solid transparent;border-radius:12px;padding:14px 26px;font-size:20px;font-weight:800;
   cursor:pointer;color:#fff;min-width:96px}
 .art-btn.der{background:var(--der)}.art-btn.die{background:var(--die)}.art-btn.das{background:var(--das)}
 .art-btn:hover{filter:brightness(1.08)}
 .art-btn.correct{outline:4px solid #2ecc71;outline-offset:2px}
 .art-btn.wrong{outline:4px solid #c0392b;outline-offset:2px;opacity:.6}
 .art-word{font-size:30px;font-weight:800;color:var(--ink);margin:10px 0 2px}
 .art-fb{font-size:14px;font-weight:700;margin-top:14px;min-height:20px;padding:0;border-radius:8px;transition:background-color .15s ease}
 .art-fb.ok{color:#219150;background-color:#e8f8ef;padding:8px 12px}
 .art-fb.no{color:#c0392b;background-color:#fdecea;padding:8px 12px}
 /* quiz self-grading + score summary */
 .grade-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
 .btn.grade-ok{background:#e8f8ef;color:#219150;border:2px solid #bfe9d2}
 .btn.grade-ok:hover{background:#d7f2e3}
 .btn.grade-no{background:#fdecea;color:#c0392b;border:2px solid #f5c6bd}
 .btn.grade-no:hover{background:#fbdcd7}
 .score-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
 .score-pill{font-size:14px;font-weight:700;border-radius:20px;padding:8px 16px}
 .score-pill.ok{color:#219150;background:#e8f8ef}
 .score-pill.no{color:#c0392b;background:#fdecea}
 /* ---------- Prepositions/Conjunctions trainer ---------- */
 .beta-badge{font-size:9px;font-weight:800;letter-spacing:.5px;color:#fff;background:#8e44ad;
   border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:2px}
 .trainer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:16px}
 .trainer-card{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:14px;
   background:#fff;padding:18px;transition:transform .08s,box-shadow .08s}
 .trainer-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.07)}
 .trainer-card .tc-icon{font-size:26px}
 .trainer-card .tc-title{font-size:15.5px;font-weight:800;margin-top:8px;color:#1f2937}
 .trainer-card .tc-desc{font-size:12.5px;color:#777;margin-top:6px;line-height:1.4}
 .trainer-card .tc-count{font-size:11px;color:var(--der);font-weight:700;margin-top:10px}
 .drawer-section-label{margin:14px 12px 4px;font-size:11px;letter-spacing:1px;text-transform:uppercase;
   color:var(--muted);font-weight:700}
 .ex-wrap{max-width:560px;margin:10px auto 0}
 .ex-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 22px;box-shadow:0 4px 20px rgba(0,0,0,.05)}
 .ex-prompt{font-size:20px;font-weight:700;text-align:center;line-height:1.5;color:#1f2937}
 .ex-choices{display:flex;flex-direction:column;gap:10px;margin-top:20px}
 .ex-choice{border:2px solid #e2dfd8;border-radius:10px;background:#fff;padding:12px 16px;font-size:16px;
   font-weight:600;cursor:pointer;text-align:left;color:#333}
 .ex-choice:hover{background:#f7f5f0}
 .ex-choice.correct{border-color:#2ecc71;background:#e8f8ef;color:#219150}
 .ex-choice.wrong{border-color:#e74c3c;background:#fdecea;color:#c0392b}
 .ex-note{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:13.5px;line-height:1.5;
   background:#f2efe9;color:#555}
 .ex-note.ok{background:#e8f8ef;color:#1e6b45}
 .ex-note.no{background:#fdecea;color:#a5362b}
 /* word-order builder */
 .ob-answer{min-height:52px;border:2px dashed #d8d5ce;border-radius:10px;padding:10px;display:flex;
   flex-wrap:wrap;gap:8px;align-items:flex-start;margin-top:18px}
 .ob-answer.filled{border-style:solid;border-color:#cfcabe}
 .ob-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed #e2dfd8}
 .ob-chunk{border:1px solid #d8d5ce;background:#fff;border-radius:8px;padding:8px 12px;font-size:15px;
   font-weight:600;cursor:pointer;color:#333}
 .ob-chunk:hover{background:#f7f5f0}
 .ob-answer .ob-chunk{cursor:pointer;background:#eaf2fb;border-color:#bcd6f0;color:#1f4e79}
 .ob-check{margin-top:18px;text-align:center}
 .ob-result{text-align:center;font-weight:700;margin-top:10px}
 .ob-result.ok{color:#219150}.ob-result.no{color:#c0392b}
 .ob-correct-sentence{text-align:center;font-size:15px;color:#555;margin-top:8px;font-style:italic}
 /* cloze (fill-in-the-story) exercises */
 .cloze-title{font-size:15px;font-weight:800;color:#8e44ad;text-align:center;margin-bottom:14px}
 .cloze-body{font-size:17px;line-height:2.1;color:#333;text-align:left}
 select.cloze-blank{font-size:15px;font-weight:700;color:#1f4e79;background:#eaf2fb;
   border:2px solid #bcd6f0;border-radius:8px;padding:3px 8px;margin:0 2px}
 .cloze-blank-result{font-weight:700;border-radius:8px;padding:2px 8px;margin:0 2px;display:inline-block}
 .cloze-blank-result.ok{color:#219150;background:#e8f8ef}
 .cloze-blank-result.no{color:#c0392b;background:#fdecea}
 /* round list */
 .trainer-card .tc-title{font-size:16px}
 /* topic explanation — plain page content, no card/border, always visible */
 .explain-section{margin:16px 4px 4px}
 .explain-section p{font-size:14.5px;line-height:1.7;color:#2b2b2b;margin:0 0 12px}
 .explain-section b{color:#16394f}
 .explain-section code{background:#eaf2fb;color:#1f5c8b;padding:2px 7px;border-radius:5px;font-size:13px;font-weight:800;border:1px solid #d5e6f6}
 table.explain-table{border-collapse:collapse;width:100%;margin:8px 0 18px;font-size:13.5px;
   background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #d8d5ce}
 table.explain-table th,table.explain-table td{border:1px solid #e2dfd8;padding:9px 12px;text-align:left}
 table.explain-table th{background:#2c6f9b;color:#fff;font-weight:700;letter-spacing:.2px}
 table.explain-table td{color:#222}
 table.explain-table tr:nth-child(even) td{background:#f5f9fd}
 table.explain-table tr:hover td{background:#eaf2fb}
 /* quiz */
 .quiz-wrap{max-width:560px;margin:10px auto 0}
 .quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
 .progress{font-size:13px;color:var(--muted)}
 .bar{height:6px;background:#eae7e0;border-radius:20px;overflow:hidden;margin:6px 0 16px}
 .bar>i{display:block;height:100%;background:var(--der);border-radius:20px;transition:width .2s}
 .qcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 20px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.05)}
 .qcard.der{background:#eef5fc}.qcard.die{background:#fdeeec}.qcard.das{background:#eafaf1}.qcard.none{background:#fff}
 .qword{font-size:32px;font-weight:800;margin:8px 0 4px}
 .qword.der{color:var(--der)}.qword.die{color:var(--die)}.qword.das{color:var(--das)}.qword.none{color:var(--ink)}
 .qhint{font-size:12px;color:var(--muted)}
 .qimg{max-width:260px;width:100%;border-radius:12px;margin:14px auto 0;display:block}
 .qans{margin-top:14px;padding-top:14px;border-top:1px dashed #ddd}
 .qen{font-size:22px;font-weight:700}.qes{font-size:15px;color:var(--muted);font-style:italic;margin-top:4px}
 .qbtns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
 .qdone{text-align:center;padding:30px 10px}
 footer{max-width:1200px;margin:0 auto;padding:18px;color:var(--muted);font-size:11.5px;text-align:center;border-top:1px solid var(--line)}
 .empty{padding:40px;text-align:center;color:var(--muted)}
</style></head>
<body>
<header>
 <button class="burger" id="burger" aria-label="Menu">&#9776;</button>
 <div class="htext"><h1 id="title">German Picture Dictionary</h1><div class="sub" id="sub">A1–A2 vocabulary · pictures, words &amp; translations · pick a lesson or search</div></div>
</header>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
 <div class="brand">Deutsch<span>.</span></div>
 <nav id="navRoot">
   <a class="nav-home" href="#/">&#127968; All words</a>
   <div id="modules"></div>
 </nav>
</aside>
<div class="controls" id="controls">
 <input id="q" placeholder="Suche… word or translation">
 <select id="sort">
  <option value="lek_new">Lesson — newest first</option>
  <option value="lek_old">Lesson — oldest first</option>
  <option value="az">Word (A–Z)</option>
 </select>
 <span class="count" id="count"></span>
</div>
<main id="out"></main>

<script>

mages/ausbildung_2.jpg", "lekRank": 1}, {"word": "Azubi", "article": "der", "tr": "apprentice / trainee", "es": "aprendiz", "wt": "Noun", "lek": "A2.2-L23", "src": "images/azubi_2.jpg", "lekRank": 1}, {"word": "Zukunft", "article": "die", "tr": "future", "es": "el futuro", "wt": "Noun", "lek": "A2.2-L22", "src": "images/zukunft_2.jpg", "lekRank": 2}, {"word": "mutig", "article": "", "tr": "brave", "es": "valiente", "wt": "Adjective", "lek": "A2.2-L22", "src": "images/mutig_2.jpg", "lekRank": 2}, {"word": "nervös", "article": "", "tr": "nervous", "es": "nervioso", "wt": "Adjective", "lek": "A2.2-L22", "src": "images/nervos_2.jpg", "lekRank": 2}, {"word": "fröhlich", "article": "", "tr": "happy", "es": "alegre", "wt": "Adjective", "lek": "A2.2-L22", "src": "images/frohlich_2.jpg", "lekRank": 2}, {"word": "langweilig", "article": "", "tr": "boring", "es": "aburrido", "wt": "Adjective", "lek": "A2.2-L22", "src": "images/langweilig_2.jpg", "lekRank": 2}, {"word": "spannend", "article": "", "tr": "exciting", "es": "emocionante", "wt": "Adjective", "lek": "A2.2-L22", "src": "images/spannend_2.jpg", "lekRank": 2}];
const PREP_MODULES=[{"key": "wowohinwoher", "label": "Wo? Wohin? Woher?", "icon": "&#128205;", "desc": "Static, direction, or origin — pick the right case logic.", "explain": "\n<p>The 9 <b>Wechselpräpositionen</b> (an, auf, hinter, in, neben, über, unter, vor, zwischen) can take\neither <b>Dativ</b> or <b>Akkusativ</b>, depending on the question you're really answering.</p>\n<table class=\"explain-table\">\n<tr><th></th><th>Wo? — Dativ</th><th>Wohin? — Akkusativ</th></tr>\n<tr><td><b>Meaning</b></td><td>Static — no movement</td><td>Movement / direction</td></tr>\n<tr><td><b>Typical verbs</b></td><td>sein, stehen, liegen, hängen, sitzen, bleiben</td><td>gehen, fahren, stellen, legen, hängen, sich setzen</td></tr>\n<tr><td><b>Example</b></td><td>Der Stift liegt auf dem Buch.</td><td>Ich lege den Stift auf das Buch.</td></tr>\n</table>\n<p style=\"margin-top:10px\"><b>Bewegung vs. Ruhe — Verbpaare:</b> some verbs describe a position (Dativ), and a matching partner verb describes moving there (Akkusativ).</p>\n<table class=\"explain-table\">\n<tr><th>Akkusativ (Bewegung)</th><th>Dativ (Position)</th></tr>\n<tr><td>stellen — to stand something up</td><td>stehen — to stand</td></tr>\n<tr><td>legen — to lay something down</td><td>liegen — to lie</td></tr>\n<tr><td>hängen — to hang something</td><td>hängen — to be hanging</td></tr>\n<tr><td>sich setzen — to sit down</td><td>sitzen — to be sitting</td></tr>\n</table>\n<p style=\"margin-top:10px\"><b>Woher?</b> asks about origin — always <code>aus</code> or <code>von</code> + Dativ, regardless of which preposition group the destination uses.</p>"}, {"key": "places", "label": "Places & Countries", "icon": "&#127968;", "desc": "Firms, people, activities, countries, water — zu/bei/von, nach/in, an/in.", "explain": "\n<p>Almost everything about places comes down to <b>three questions</b>. Once you know which question you're\nanswering, the preposition (mostly) follows automatically from the type of place:</p>\n<table class=\"explain-table\">\n<tr><th>Frage</th><th>Bedeutung</th><th>Kasus</th><th>Typische Verben</th></tr>\n<tr><td><b>Woher?</b></td><td>de donde (origin)</td><td>Dativ</td><td>kommen...</td></tr>\n<tr><td><b>Wo?</b></td><td>donde (location)</td><td>Dativ</td><td>sein, bleiben, stehen, liegen, hängen, sitzen</td></tr>\n<tr><td><b>Wohin?</b></td><td>hacia donde (direction)</td><td>Akkusativ</td><td>gehen, fahren, reisen, fliegen, joggen, segeln, schwimmen, wandern, klettern, laufen, springen, fallen</td></tr>\n</table>\n<p style=\"margin-top:14px\">Here is the full pattern for every type of place, side by side:</p>\n<table class=\"explain-table\">\n<tr><th>Ortstyp</th><th>Woher?</th><th>Wo?</th><th>Wohin?</th></tr>\n<tr><td>Firma (z.B. Diunsa)</td><td>von Diunsa</td><td>bei Diunsa</td><td>zu Diunsa</td></tr>\n<tr><td>Person / Beruf (Richard)</td><td>von Richard</td><td>bei Richard</td><td>zu Richard</td></tr>\n<tr><td>Person / Beruf (der Arzt)</td><td>vom Arzt</td><td>beim Arzt</td><td>zum Arzt</td></tr>\n<tr><td>Person / Beruf (die Zahnärztin)</td><td>von der Zahnärztin</td><td>bei der Zahnärztin</td><td>zur Zahnärztin</td></tr>\n<tr><td>Aktivität (der Sport)</td><td>vom Sport</td><td>beim Sport</td><td>zum Sport</td></tr>\n<tr><td>Aktivität (das Yoga)</td><td>vom Yoga</td><td>beim Yoga</td><td>zum Yoga</td></tr>\n<tr><td>Aktivität (die Gymnastik)</td><td>von der Gymnastik</td><td>bei der Gymnastik</td><td>zur Gymnastik</td></tr>\n<tr><td>Zuhause</td><td>von zu Hause</td><td>zu Hause</td><td>nach Hause</td></tr>\n<tr><td>Land ohne Artikel (Deutschland)</td><td>aus Deutschland</td><td>in Deutschland</td><td>nach Deutschland</td></tr>\n<tr><td>Land mit Artikel (die Schweiz)</td><td>aus der Schweiz</td><td>in der Schweiz</td><td>in die Schweiz</td></tr>\n<tr><td>Land mit Artikel (die USA, Pl.)</td><td>aus den USA</td><td>in den USA</td><td>in die USA</td></tr>\n<tr><td>Wasser — in der Nähe (der Strand)</td><td>vom Strand</td><td>am Strand</td><td>an den Strand</td></tr>\n<tr><td>Wasser — in der Nähe (das Meer)</td><td>vom Meer</td><td>am Meer</td><td>ans Meer</td></tr>\n<tr><td>Wasser — selbst (das Meer)</td><td>aus dem Meer</td><td>im Meer</td><td>ins Meer</td></tr>\n<tr><td>Wasser — selbst (der Fluss)</td><td>aus dem Fluss</td><td>im Fluss</td><td>in den Fluss</td></tr>\n</table>\n<p style=\"margin-top:14px\"><b>Firmen, Personen &amp; Aktivitäten</b> all share one pattern: <code>von/vom</code> (Woher), <code>bei/beim</code> (Wo),\n<code>zu/zum/zur</code> (Wohin) — always + Dativ. This is memorized as a set, not derived from a rule.</p>\n<p style=\"margin-top:10px\"><b>Zuhause</b> has extra forms worth knowing: <code>bei Valeria zu Hause</code> / <code>bei ihr zu Hause</code>\n(at someone's home) and <code>zu Valeria nach Hause</code> / <code>zu dir nach Hause</code> (heading to someone's home).\n<code>zu Hause</code> (static) vs. <code>nach Hause</code> (movement) is a very common exam pair.</p>\n<p style=\"margin-top:10px\"><b>Countries</b>: most have no article (Deutschland, Honduras, Brasilien, Kanada...) → use <code>nach</code>.\nA few take an article (die Schweiz, die USA, der Vatikan, die Türkei) → use <code>in</code>/<code>aus</code> + article instead.</p>\n<p style=\"margin-top:10px\"><b>Water</b>: <code>an/am/ans</code> = near the water's edge (Strand, See, Fluss-Ufer);\n<code>in/im/ins</code> = actually inside the water.</p>\n"}, {"key": "time", "label": "Time Expressions", "icon": "&#8986;", "desc": "vor, seit, in, ab, für, über — talking about when and how long.", "explain": "\n<table class=\"explain-table\">\n<tr><th>Präposition</th><th>Bedeutung</th><th>Beispiel</th></tr>\n<tr><td><code>in</code> + Dativ</td><td>a point in the future</td><td>In einem Jahr fliege ich nach Deutschland.</td></tr>\n<tr><td><code>vor</code> + Dativ + Vergangenheit</td><td>ago (hace)</td><td>Vor einem Monat bin ich geflogen.</td></tr>\n<tr><td><code>seit</code> + Präsens</td><td>since — started in the past, still ongoing</td><td>Seit fünf Monaten lerne ich Deutsch.</td></tr>\n<tr><td><code>ab</code></td><td>starting from</td><td>Ab 9 Uhr habe ich eine Party.</td></tr>\n<tr><td><code>von...bis</code></td><td>from...to</td><td>Von Montag bis Freitag haben wir Kurs.</td></tr>\n<tr><td><code>vor</code> / <code>nach</code></td><td>before / after (sequence)</td><td>Vor dem Kurs mache ich die Hausaufgabe.</td></tr>\n</table>\n<p style=\"margin-top:10px\"><b>Duration — für vs. über</b> (both + Akkusativ):</p>\n<table class=\"explain-table\">\n<tr><th>für</th><th>über</th></tr>\n<tr><td>planned/intended duration</td><td>a duration exceeding a limit (\"more than\")</td></tr>\n<tr><td>Ich bleibe für einen Monat.</td><td>Ich bleibe über ein Jahr (= mehr als ein Jahr).</td></tr>\n</table>\n<p style=\"margin-top:10px\">⚠️ Unlike English/Spanish, German uses the <b>present tense</b> with <code>seit</code> for an action still happening now.</p>"}, {"key": "fixedcase", "label": "Fixed-Case Prepositions", "icon": "&#128203;", "desc": "Always-Dativ vs always-Akkusativ — quick memorization drill.", "explain": "\n<p>Unlike the Wechselpräpositionen, these prepositions <b>never change case</b> — it doesn't matter if there's movement or not.</p>\n<table class=\"explain-table\">\n<tr><th>Gruppe</th><th>Kasus</th><th>Präpositionen</th></tr>\n<tr><td>Immer Dativ</td><td>Dativ</td><td>aus, bei, mit, nach, seit, von, zu</td></tr>\n<tr><td>Immer Akkusativ</td><td>Akkusativ</td><td>durch, für, gegen, ohne, um</td></tr>\n</table>\n<p style=\"margin-top:10px\">Memory rhyme from the course: <i>\"aus, bei, mit, nach, seit, von, zu — immer mit dem Dativ: dem, der, den.\"</i></p>\n<p style=\"margin-top:6px\">Note: <code>für</code> and <code>über</code> can also express time <i>duration</i> (see the Time Expressions module) — same Akkusativ case, different meaning.</p>"}, {"key": "verbprep", "label": "Verbs + Prepositions", "icon": "&#128279;", "desc": "sich interessieren für, warten auf — with da-/wo- substitution.", "explain": "\n<p>Many German verbs pair with a <b>fixed preposition</b> that must be memorized together with the verb — the general Wo?/Wohin? logic doesn't apply here.</p>\n<table class=\"explain-table\">\n<tr><th>Verb + Präposition</th><th>Frage (Sache)</th><th>Beispiel</th></tr>\n<tr><td>sich interessieren für</td><td>Wofür...?</td><td>Ich interessiere mich dafür.</td></tr>\n<tr><td>sich freuen über / auf</td><td>Worüber.../Worauf...?</td><td>Ich freue mich darüber / darauf.</td></tr>\n<tr><td>warten auf</td><td>Worauf...?</td><td>Ich warte darauf.</td></tr>\n<tr><td>sich erinnern an</td><td>Woran...?</td><td>Ich erinnere mich daran.</td></tr>\n<tr><td>zufrieden sein mit</td><td>Womit...?</td><td>Ich bin damit zufrieden.</td></tr>\n</table>\n<p style=\"margin-top:10px\"><b>Asking about a thing:</b> <code>wo(r)-</code> + preposition (worauf, worüber — an 'r' is inserted before a vowel).</p>\n<p style=\"margin-top:6px\"><b>Replacing a thing already mentioned:</b> <code>da(r)-</code> + preposition (darauf, darüber).</p>\n<p style=\"margin-top:6px\"><b>Asking/answering about a person:</b> no wo-/da- substitute — use the preposition directly + wen/wem, or a personal pronoun. <i>Auf wen wartest du? → Ich warte auf ihn.</i></p>"}, {"key": "contractions", "label": "Contractions", "icon": "&#10024;", "desc": "im, ins, zum, zur, vom, beim — fast recognition drill.", "explain": "\n<p>Preposition + definite article often merge into one word. This is common in speech and writing, and sounds much more natural than keeping them separate.</p>\n<table class=\"explain-table\">\n<tr><th>Präposition + Artikel</th><th>Kontraktion</th><th>Beispiel</th></tr>\n<tr><td>in + das</td><td>ins</td><td>Ich gehe ins Kino.</td></tr>\n<tr><td>in + dem</td><td>im</td><td>Ich bin im Park.</td></tr>\n<tr><td>an + das</td><td>ans</td><td>Ich gehe ans Meer.</td></tr>\n<tr><td>an + dem</td><td>am</td><td>Ich bin am Strand.</td></tr>\n<tr><td>zu + dem</td><td>zum</td><td>Ich gehe zum Arzt.</td></tr>\n<tr><td>zu + der</td><td>zur</td><td>Ich gehe zur Zahnärztin.</td></tr>\n<tr><td>von + dem</td><td>vom</td><td>Ich komme vom Arzt.</td></tr>\n<tr><td>bei + dem</td><td>beim</td><td>Ich bin beim Sport.</td></tr>\n</table>"}];
const PREP_EXERCISES={"wowohinwoher": [{"type": "mc", "prompt": "Der Stift liegt ___ dem Buch. (Wo?)", "choices": ["auf", "auf den"], "answer": "auf", "note": "Static position → Dativ (Wo?): auf dem Buch."}, {"type": "mc", "prompt": "Ich lege den Stift ___ das Buch. (Wohin?)", "choices": ["auf dem", "auf das"], "answer": "auf das", "note": "Movement/direction → Akkusativ (Wohin?): auf das Buch."}, {"type": "mc", "prompt": "Ich komme ___ der Schweiz. (Woher?)", "choices": ["aus", "nach", "in"], "answer": "aus", "note": "Origin (Woher?) always takes 'aus' + Dativ, regardless of preposition group."}, {"type": "mc", "prompt": "Die Kleidung hängt ___ Wandschrank. (Wo?)", "choices": ["im", "in den"], "answer": "im", "note": "'im' = in + dem (Dativ) → static position."}, {"type": "mc", "prompt": "Ich hänge das Kleid ___ die Tür. (Wohin?)", "choices": ["an", "an der"], "answer": "an", "note": "Movement onto a surface → Akkusativ: an die Tür."}, {"type": "mc", "prompt": "Was ist der Unterschied? 'Wohin gehst du?' fragt nach...", "choices": ["Richtung / Bewegung", "Ort ohne Bewegung", "Herkunft"], "answer": "Richtung / Bewegung", "note": "Wohin? = direction/movement → Akkusativ."}, {"type": "mc", "prompt": "'Wo bist du?' fragt nach...", "choices": ["Richtung", "einem festen Ort (keine Bewegung)", "Herkunft"], "answer": "einem festen Ort (keine Bewegung)", "note": "Wo? = static location, no motion → Dativ."}, {"type": "mc", "prompt": "'Woher kommst du?' fragt nach...", "choices": ["Ursprung / Herkunft", "Ziel", "Position"], "answer": "Ursprung / Herkunft", "note": "Woher? = origin → always 'aus' or 'von' + Dativ."}, {"type": "mc", "prompt": "Sie setzt sich ___ den Stuhl.", "choices": ["auf", "auf dem"], "answer": "auf", "note": "'sich setzen' = movement (sitting down) → Akkusativ: auf den Stuhl."}, {"type": "mc", "prompt": "Sie sitzt ___ dem Stuhl.", "choices": ["auf", "auf den"], "answer": "auf", "note": "'sitzen' = static state (already seated) → Dativ: auf dem Stuhl."}, {"type": "mc", "prompt": "Ein Bild hängt ___ der Wand.", "choices": ["an", "an die"], "answer": "an", "note": "'hängen' (intransitive, state) → Dativ: an der Wand."}, {"type": "mc", "prompt": "Ich hänge ein Bild ___ die Wand.", "choices": ["an", "an der"], "answer": "an", "note": "'hängen' (transitive, action) → Akkusativ: an die Wand."}, {"type": "mc", "prompt": "Der Computer steht ___ dem Bett.", "choices": ["auf", "auf das"], "answer": "auf", "note": "'stehen' = static → Dativ."}, {"type": "mc", "prompt": "Du stellst den Computer ___ den Stuhl.", "choices": ["auf", "auf dem"], "answer": "auf", "note": "'stellen' = action/movement → Akkusativ."}, {"type": "order", "prompt": "Build the sentence: (I put the pen on the book — movement)", "chunks": ["Ich", "lege", "den", "Stift", "auf", "das", "Buch", "."], "note": "stellen/legen + Akkusativ = movement onto a surface."}, {"type": "order", "prompt": "Build the sentence: (The bottle is over the pen — static position)", "chunks": ["Die", "Flasche", "ist", "über", "dem", "Kugelschreiber", "."], "note": "sein + Dativ = static position (Wo?)."}, {"type": "cloze", "title": "Im Wohnzimmer", "segments": ["Das Sofa steht ", {"choices": ["neben", "neben dem", "neben das"], "answer": "neben dem"}, " Fenster. ", "Ich stelle den Fernseher ", {"choices": ["auf", "auf den", "auf dem"], "answer": "auf den"}, " Schrank. ", "Die Lampe hängt ", {"choices": ["über", "über dem", "über das"], "answer": "über dem"}, " Tisch. ", "Ich lege das Buch ", {"choices": ["auf", "auf den", "auf das"], "answer": "auf das"}, " Sofa. ", "Die Katze sitzt jetzt ", {"choices": ["auf", "auf den", "auf dem"], "answer": "auf dem"}, " Buch und schläft. ", "Später hänge ich ein neues Bild ", {"choices": ["an", "an der", "an die"], "answer": "an die"}, " Wand."], "note": "Position (Wo?) = Dativ: über dem, auf dem. Bewegung (Wohin?) = Akkusativ: auf den, auf das, an die."}], "places": [{"type": "mc", "prompt": "Ich gehe ___ Arzt. (Wohin?)", "choices": ["zum", "beim", "vom"], "answer": "zum", "note": "Wohin zu einer Person/einem Ort mit Artikel → zu + Dativ → zum Arzt."}, {"type": "mc", "prompt": "Ich bin ___ Arzt. (Wo?)", "choices": ["beim", "zum", "vom"], "answer": "beim", "note": "Wo bei einer Person → bei + Dativ → beim Arzt."}, {"type": "mc", "prompt": "Ich komme ___ Arzt. (Woher?)", "choices": ["vom", "zum", "beim"], "answer": "vom", "note": "Woher von einer Person → von + Dativ → vom Arzt."}, {"type": "mc", "prompt": "Ich fahre ___ Deutschland. (Wohin? — kein Artikel)", "choices": ["nach", "in", "zu"], "answer": "nach", "note": "Länder ohne Artikel → nach + Land (kein Artikel nötig)."}, {"type": "mc", "prompt": "Ich fahre ___ Schweiz. (Wohin? — mit Artikel)", "choices": ["in die", "nach", "zur"], "answer": "in die", "note": "Länder MIT Artikel (die Schweiz) → in + Akkusativ-Artikel."}, {"type": "mc", "prompt": "Ich komme ___ USA. (Woher? — mit Artikel)", "choices": ["aus den", "von den", "nach den"], "answer": "aus den", "note": "Woher + Land mit Artikel (die USA, Plural) → aus + Dativ."}, {"type": "mc", "prompt": "Ich bin ___ Vatikan. (Wo? — mit Artikel)", "choices": ["in dem", "in den", "nach dem"], "answer": "in dem", "note": "Wo + Land mit Artikel → in + Dativ."}, {"type": "mc", "prompt": "Ich bin ___ Meer. (Wo? — in der Nähe des Wassers)", "choices": ["am", "im", "zum"], "answer": "am", "note": "'am' (an+dem) = in the vicinity of water, not inside it."}, {"type": "mc", "prompt": "Ich schwimme ___ Meer. (Wo? — im Wasser selbst)", "choices": ["im", "am", "ins"], "answer": "im", "note": "'im' (in+dem) = inside/in the water itself."}, {"type": "mc", "prompt": "Ich gehe ___ Meer. (Wohin? — an den Rand)", "choices": ["ans", "ins", "am"], "answer": "ans", "note": "'ans' (an+das) = heading to the water's edge."}, {"type": "mc", "prompt": "Ich springe ___ Meer. (Wohin? — hinein)", "choices": ["ins", "ans", "im"], "answer": "ins", "note": "'ins' (in+das) = movement into the water itself."}, {"type": "mc", "prompt": "Ich gehe ___ Diunsa. (Wohin? — Firma)", "choices": ["zu", "bei", "von"], "answer": "zu", "note": "Firmen folgen demselben Muster wie Personen: zu (Wohin), bei (Wo), von (Woher)."}, {"type": "mc", "prompt": "Ich arbeite ___ Diunsa. (Wo? — Firma)", "choices": ["bei", "zu", "von"], "answer": "bei", "note": "Wo (bei einer Firma/Person) → bei + Dativ."}, {"type": "mc", "prompt": "Ich komme ___ Yoga. (Woher? — Aktivität)", "choices": ["vom", "zum", "beim"], "answer": "vom", "note": "Aktivitäten funktionieren wie Personen: von/bei/zu + Dativ."}, {"type": "mc", "prompt": "Ich bin ___ Hause. (Wo? — estático)", "choices": ["zu", "nach", "bei"], "answer": "zu", "note": "'zu Hause' = at home, no movement."}, {"type": "mc", "prompt": "Ich gehe ___ Hause. (Wohin? — movimiento)", "choices": ["nach", "zu", "in"], "answer": "nach", "note": "'nach Hause' = heading home, movement/direction."}, {"type": "mc", "prompt": "Ich bin ___ Valeria zu Hause. (Wo? — en casa de alguien)", "choices": ["bei", "zu", "von"], "answer": "bei", "note": "'bei + Person + zu Hause' = at someone's home."}, {"type": "order", "prompt": "Build: I'm going to Germany. (no article country)", "chunks": ["Ich", "fahre", "nach", "Deutschland", "."], "note": "Country without article → nach + country name directly."}, {"type": "order", "prompt": "Build: I come from the doctor's.", "chunks": ["Ich", "komme", "vom", "Arzt", "."], "note": "vom = von + dem, contraction for Woher + person."}, {"type": "order", "prompt": "Build: We are going to the beach.", "chunks": ["Wir", "gehen", "an", "den", "Strand", "."], "note": "'an den Strand' = movement toward the water's edge (Akkusativ)."}, {"type": "mc", "prompt": "Welcher Kasus bei 'Woher?' — z.B. 'Ich komme...'", "choices": ["Dativ", "Akkusativ", "Nominativ"], "answer": "Dativ", "note": "Woher? (origin) is always Dativ, just like Wo?."}, {"type": "mc", "prompt": "Welches Verb passt zu 'Wohin?' NICHT zu 'Wo?'", "choices": ["fahren", "bleiben", "sein"], "answer": "fahren", "note": "fahren/gehen/fliegen = movement → Wohin? Akkusativ. sein/bleiben = static → Wo? Dativ."}, {"type": "mc", "prompt": "Ich komme ___ Diunsa. (Woher? — Firma)", "choices": ["von", "zu", "bei"], "answer": "von", "note": "Firmen: von (Woher), bei (Wo), zu (Wohin) — always + Dativ."}, {"type": "mc", "prompt": "Ich gehe ___ Zahnärztin. (Wohin? — weiblich)", "choices": ["zur", "zum", "bei der"], "answer": "zur", "note": "zur = zu + der (feminine Dativ article) → zur Zahnärztin."}, {"type": "mc", "prompt": "Ich bin ___ Zahnärztin. (Wo? — weiblich)", "choices": ["bei der", "zur", "von der"], "answer": "bei der", "note": "bei + der (feminine Dativ) → bei der Zahnärztin."}, {"type": "mc", "prompt": "Ich komme ___ Ärzten. (Woher? — Plural)", "choices": ["von den", "aus den", "bei den"], "answer": "von den", "note": "Plural Dativ article 'den' + von for Woher with people: von den Ärzten."}, {"type": "mc", "prompt": "Ich gehe ___ Sport. (Wohin? — Aktivität)", "choices": ["zum", "beim", "vom"], "answer": "zum", "note": "Aktivitäten folgen dem Personen-Muster: zu/zum (Wohin) + Dativ."}, {"type": "mc", "prompt": "Ich bin ___ Basketball. (Wo? — Aktivität)", "choices": ["beim", "zum", "vom"], "answer": "beim", "note": "beim = bei + dem, for an ongoing activity: beim Basketball."}, {"type": "mc", "prompt": "Ich komme ___ Gymnastik. (Woher? — weiblich, Aktivität)", "choices": ["von der", "bei der", "zur"], "answer": "von der", "note": "von + der (feminine Dativ) for Woher: von der Gymnastik."}, {"type": "mc", "prompt": "Ich komme ___ zu Hause. (Woher?)", "choices": ["von", "nach", "zu"], "answer": "von", "note": "'von zu Hause' = from home (origin)."}, {"type": "mc", "prompt": "Ich bin ___ Valeria zu Hause. (Wo? — variant mit Pronomen)", "choices": ["bei ihr", "zu ihr", "von ihr"], "answer": "bei ihr", "note": "'bei ihr zu Hause' = at her place, using the personal pronoun instead of the name."}, {"type": "mc", "prompt": "Ich gehe ___ Valeria nach Hause. (Wohin? — zu jemandes Zuhause)", "choices": ["zu", "bei", "nach"], "answer": "zu", "note": "'zu Valeria nach Hause' = heading to Valeria's home (movement)."}, {"type": "mc", "prompt": "Ich fahre ___ Russland. (Wohin? — kein Artikel)", "choices": ["nach", "in", "zu"], "answer": "nach", "note": "Russland has no article → nach Russland, same pattern as Deutschland."}, {"type": "mc", "prompt": "Ich fahre ___ Türkei. (Wohin? — mit Artikel)", "choices": ["in die", "nach", "zur"], "answer": "in die", "note": "die Türkei takes an article → in die Türkei (Akkusativ, Wohin)."}, {"type": "mc", "prompt": "Ich bin ___ See. (Wo? — in der Nähe)", "choices": ["am", "im", "zum"], "answer": "am", "note": "am See = at the lakeside, not inside the water."}, {"type": "mc", "prompt": "Ich schwimme ___ Fluss. (Wohin? — hinein)", "choices": ["in den", "im", "an den"], "answer": "in den", "note": "Movement into the river itself → in den Fluss (Akkusativ, no contraction for der-words)."}, {"type": "order", "prompt": "Build: I'm coming from the dentist (female).", "chunks": ["Ich", "komme", "von", "der", "Zahnärztin", "."], "note": "von + der (Dativ feminine) for Woher with a female professional."}, {"type": "order", "prompt": "Build: We are at Diunsa (working there).", "chunks": ["Wir", "sind", "bei", "Diunsa", "."], "note": "bei + Firma (no article needed for company names) = Wo?, static."}, {"type": "order", "prompt": "Build: I'm going home (movement).", "chunks": ["Ich", "gehe", "nach", "Hause", "."], "note": "nach Hause = heading home, the movement form (no article after nach Hause)."}, {"type": "cloze", "title": "Ein Wochenende bei Freunden", "segments": ["Am Freitag fahre ich ", {"choices": ["nach", "in", "zu"], "answer": "nach"}, " Hamburg, weil meine Freundin dort wohnt. ", "Ich komme ", {"choices": ["aus", "von", "in"], "answer": "aus"}, " München, aber ich fahre oft dorthin. ", "Am Samstag gehen wir ", {"choices": ["zum", "beim", "vom"], "answer": "zum"}, " Markt und kaufen frisches Gemüse. ", "Danach sind wir ", {"choices": ["bei", "zu", "nach"], "answer": "bei"}, " ihren Eltern zu Hause und essen zusammen. ", "Am Abend gehen wir ", {"choices": ["ins", "im", "zum"], "answer": "ins"}, " Kino und sehen einen neuen Film. ", "Am Sonntag komme ich wieder ", {"choices": ["von", "aus", "nach"], "answer": "von"}, " ihr zurück nach München."], "note": "nach/aus für Länder & Städte ohne Artikel; zu/bei für Personen (Wohin/Wo); zum = zu + dem; ins = in + das."}, {"type": "cloze", "title": "Im Urlaub am Meer", "segments": ["Diesen Sommer fahren wir ", {"choices": ["an", "in", "zu"], "answer": "an"}, " die Ostsee. ", "Wir wohnen in einem kleinen Hotel ", {"choices": ["am", "im", "ans"], "answer": "am"}, " Strand. ", "Jeden Morgen gehen wir ", {"choices": ["ins", "im", "am"], "answer": "ins"}, " Wasser und schwimmen eine Stunde. ", "Am Nachmittag fahren wir manchmal ", {"choices": ["in die", "nach", "aus der"], "answer": "in die"}, " Stadt, um einzukaufen. ", "Meine Schwester kommt ", {"choices": ["aus", "von", "in"], "answer": "aus"}, " der Schweiz zu Besuch. ", "Sie ist noch nie ", {"choices": ["am", "im", "ans"], "answer": "am"}, " Meer gewesen, deshalb freut sie sich sehr."], "note": "an/am für die Nähe des Wassers (Strand), in/im für das Wasser selbst; Länder mit Artikel (die Schweiz) → aus der Schweiz."}], "time": [{"type": "mc", "prompt": "___ einem Jahr fliege ich nach Deutschland. (in X Zeit ab jetzt)", "choices": ["In", "Vor", "Seit"], "answer": "In", "note": "'in' + Dativ = a point in the future, X time from now."}, {"type": "mc", "prompt": "___ einem Monat bin ich nach Brasilien geflogen. (hace / ago)", "choices": ["Vor", "In", "Seit"], "answer": "Vor", "note": "'vor' + Dativ + Vergangenheit = ago (a point in the past)."}, {"type": "mc", "prompt": "___ fünf Monaten lerne ich Deutsch. (desde / since, action still ongoing)", "choices": ["Seit", "Vor", "Für"], "answer": "Seit", "note": "'seit' + Präsens = started in the past, still continuing now."}, {"type": "mc", "prompt": "___ 9 Uh itionen"], "answer": "Immer Akkusativ", "note": "Diese 5 Präpositionen sind immer Akkusativ."}, {"type": "order", "prompt": "Build: I come from Switzerland.", "chunks": ["Ich", "komme", "aus", "der", "Schweiz", "."], "note": "'aus' ist immer Dativ."}], "verbprep": [{"type": "mc", "prompt": "Ich interessiere mich ___ den Deutschkurs.", "choices": ["für", "an", "auf"], "answer": "für", "note": "sich interessieren für + Akkusativ (fixed pair)."}, {"type": "mc", "prompt": "Wofür interessierst du dich? → Ich interessiere mich ___.", "choices": ["dafür", "davon", "daran"], "answer": "dafür", "note": "da(r)- + Präposition ersetzt eine SACHE: dafür = für das (Thema)."}, {"type": "mc", "prompt": "Ich warte ___ die Pause.", "choices": ["auf", "für", "an"], "answer": "auf", "note": "warten auf + Akkusativ (fixed pair)."}, {"type": "mc", "prompt": "Worauf wartest du? → Ich warte ___.", "choices": ["darauf", "dafür", "davon"], "answer": "darauf", "note": "da(r)- + auf → darauf, für eine SACHE."}, {"type": "mc", "prompt": "Ich erinnere mich ___ die Hausaufgabe.", "choices": ["an", "von", "auf"], "answer": "an", "note": "sich erinnern an + Akkusativ."}, {"type": "mc", "prompt": "Woran erinnerst du dich? → Ich erinnere mich ___.", "choices": ["daran", "davon", "dafür"], "answer": "daran", "note": "da(r)- + an → daran (r eingefügt vor Vokal)."}, {"type": "mc", "prompt": "Ich träume ___ der Arbeit.", "choices": ["von", "für", "an"], "answer": "von", "note": "träumen von + Dativ."}, {"type": "mc", "prompt": "Ich bin ___ dem Geld zufrieden.", "choices": ["mit", "für", "von"], "answer": "mit", "note": "zufrieden sein mit + Dativ."}, {"type": "mc", "prompt": "Ich habe Angst ___ der Krimiserie.", "choices": ["vor", "von", "an"], "answer": "vor", "note": "Angst haben vor + Dativ."}, {"type": "mc", "prompt": "Ich kümmere mich ___ das Gepäck.", "choices": ["um", "für", "an"], "answer": "um", "note": "sich kümmern um + Akkusativ."}, {"type": "mc", "prompt": "Wenn nach einer PERSON gefragt wird — 'Auf wen konzentrierst du dich?' → Ich konzentriere mich auf ___.", "choices": ["ihn", "darauf", "es"], "answer": "ihn", "note": "PERSON → Präposition + Personalpronomen, kein da(r)-Ersatz."}, {"type": "mc", "prompt": "Beginnt die Präposition mit einem Vokal (z.B. auf), was passiert bei wo-/da-?", "choices": ["ein 'r' wird eingefügt: worauf/darauf", "nichts ändert sich", "die Präposition fällt weg"], "answer": "ein 'r' wird eingefügt: worauf/darauf", "note": "wo+r+auf=worauf, da+r+auf=darauf — das 'r' verhindert zwei Vokale nebeneinander."}, {"type": "order", "prompt": "Build: I'm happy about the vacation.", "chunks": ["Ich", "freue", "mich", "über", "den", "Urlaub", "."], "note": "sich freuen über + Akkusativ (already happened / current situation)."}, {"type": "order", "prompt": "Build: I'm looking forward to the vacation.", "chunks": ["Ich", "freue", "mich", "auf", "den", "Urlaub", "."], "note": "sich freuen auf + Akkusativ (something upcoming)."}, {"type": "cloze", "title": "Ein Gespräch unter Freunden", "segments": ["Ich interessiere mich sehr ", {"choices": ["für", "an", "auf"], "answer": "für"}, " Musik. ", "Worauf freust du dich am meisten? — Ich freue mich schon ", {"choices": ["auf", "über", "an"], "answer": "auf"}, " die Ferien. ", "Ich warte schon lange ", {"choices": ["auf", "für", "an"], "answer": "auf"}, " eine Antwort von der Uni. ", "Erinnerst du dich noch ", {"choices": ["an", "von", "für"], "answer": "an"}, " unseren ersten Deutschkurs? ", "Ja, und ich bin immer noch sehr zufrieden ", {"choices": ["mit", "von", "für"], "answer": "mit"}, " meinen Fortschritten. ", "Ich kümmere mich jetzt auch ", {"choices": ["um", "für", "an"], "answer": "um"}, " meine kleine Schwester, sie lernt auch Deutsch!"], "note": "Feste Verb-Präposition-Paare müssen einzeln gelernt werden: sich freuen auf/über, warten auf, sich erinnern an, zufrieden mit, sich kümmern um."}], "contractions": [{"type": "mc", "prompt": "in + das = ?", "choices": ["ins", "im", "ans"], "answ const VERBCASE_EXPLAIN="\n<p>Some German verbs take <b>two objects</b>: a direct object (<b>Akkusativ</b> — the thing) and an indirect object\n(<b>Dativ</b> — the person). The case itself usually isn't the hard part — the hard part is <b>where each object goes</b>.\nThis trainer is only about that: positioning.</p>\n<table class=\"explain-table\">\n<tr><th>Kasus</th><th>Frage</th><th>Rolle</th><th>Beispiel</th></tr>\n<tr><td>Akkusativ</td><td>Was?</td><td>direct object — the thing</td><td>Was kaufe ich? — Ich kaufe den Laptop.</td></tr>\n<tr><td>Dativ</td><td>Wem?</td><td>indirect object — the person</td><td>Wem kaufe ich den Laptop? — Ich kaufe meiner Mutter den Laptop.</td></tr>\n</table>\n<p style=\"margin-top:14px\"><b>Common verbs with Akkusativ + Dativ</b> (the object pattern below applies to all of these):\n<code>geben</code>, <code>bringen</code>, <code>empfehlen</code>, <code>zeigen</code>, <code>erzählen</code>,\n<code>leihen</code>, <code>schenken</code>, <code>schicken</code>, <code>erklären</code>, <code>kaufen</code>, <code>schreiben</code>.</p>\n<p style=\"margin-top:14px\"><b>Word order — the three rules.</b> The order depends on whether each object is a\nnoun or a pronoun:</p>\n<table class=\"explain-table\">\n<tr><th>Situation</th><th>Regel</th><th>Beispiel</th></tr>\n<tr><td>Zwei Substantive (2 nouns)</td><td>Dativ vor Akkusativ</td><td>Gabriela schenkt <u>ihrer Mutter</u> <u>einen Laptop</u>.</td></tr>\n<tr><td>Substantiv + Pronomen</td><td>Pronomen zuerst — Kasus ist egal</td><td>Gabriela schenkt <u>ihr</u> einen Laptop. / Gabriela schenkt <u>ihn</u> ihrer Mutter.</td></tr>\n<tr><td>Zwei Pronomen</td><td>Akkusativ vor Dativ</td><td>Gabriela schenkt <u>ihn</u> <u>ihr</u>.</td></tr>\n</table>\n<p style=\"margin-top:10px\">⚠️ Notice the pronoun rule is the one that trips people up: with a noun + pronoun mix, the\n<b>pronoun always jumps to the front</b> — it doesn't matter if it's the Akkusativ or the Dativ pronoun.\nOnly when <i>both</i> objects are pronouns does the Akkusativ-before-Dativ rule apply.</p>\n<p style=\"margin-top:10px\"><b>Full example:</b> Ich gebe meiner Cousine das Buch. → Ich gebe ihr das Buch.\n(noun+pronoun: pronoun first) → Ich gebe es meiner Cousine. (noun+pronoun: pronoun first) →\nIch gebe es ihr. (2 pronouns: Akkusativ 'es' before Dativ 'ihr')</p>\n";

const SITE_TITLE="German Picture Dictionary", SITE_SUB="A1–A2 vocabulary · pictures, words &amp; translations · pick a lesson or search";
const $=s=>document.querySelector(s);
const out=$('#out'),titleEl=$('#title'),subEl=$('#sub'),controls=$('#controls'),
      q=$('#q'),sortSel=$('#sort'),countEl=$('#count'),
      drawer=$('#drawer'),overlay=$('#overlay'),modulesEl=$('#modules'),navRootEl=$('#navRoot');
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function gc(a){return a==='der'?'der':a==='die'?'die':a==='das'?'das':'none'}
function rank(l){const r=DATA.find(x=>x.lek===l);return r?r.lekRank:999}
const LESSONS=[...new Set(DATA.map(r=>r.lek))].sort((a,b)=>rank(a)-rank(b));
const WTYPES=[
  {key:"Noun",     label:"Nouns",      route:"noun"},
  {key:"Adjective",label:"Adjectives", route:"adj"},
  {key:"Verb",     label:"Verbs",      route:"verb"},
];
// level = leading CEFR tier, e.g. "A2.2-L21" -> "A2", "A1.1-L03" -> "A1", "General" -> "General"
function levelOf(lek){ const m=lek.match(/^([ABC][12])/); return m?m[1]:'General'; }
const LEVEL_ORDER=["C2","C1","B2","B1","A2","A1","General"];
const LEVELS=[...new Set(LESSONS.map(levelOf))].sort((a,b)=>LEVEL_ORDER.indexOf(a)-LEVEL_ORDER.indexOf(b));

/* ---------- drawer: accordion modules > levels > lessons ---------- */
function lessonLink(route,l,filterWt){
  const n=filterWt?DATA.filter(r=>r.lek===l&&r.wt===filterWt).length:DATA.filter(r=>r.lek===l).length;
  if(filterWt && !n) return '';
  const href=route==='lektion'?`#lektion/${encodeURIComponent(l)}`:`#${route}/${encodeURIComponent(l)}`;
  const dataRoute=route==='lektion'?`lektion/${encodeURIComponent(l)}`:`${route}/${encodeURIComponent(l)}`;
  return `<a class="sub-link" data-route="${dataRoute}" href="${href}"><span>${esc(l)}</span><span class="n">${n}</span></a>`;
}
function levelBlock(modKey,route,filterWt){
  let h='';
  for(const lvl of LEVELS){
    const lessonsInLvl=LESSONS.filter(l=>levelOf(l)===lvl);
    const links=lessonsInLvl.map(l=>lessonLink(route,l,filterWt)).join('');
    if(!links.trim()) continue;
    const count=filterWt?DATA.filter(r=>lessonsInLvl.includes(r.lek)&&r.wt===filterWt).length
                        :DATA.filter(r=>lessonsInLvl.includes(r.lek)).length;
    const allHref=route==='lektion'?`#lektion/level/${encodeURIComponent(lvl)}`:`#${route}/level/${encodeURIComponent(lvl)}`;
    const allDataRoute=route==='lektion'?`lektion/level/${encodeURIComponent(lvl)}`:`${route}/level/${encodeURIComponent(lvl)}`;
    const allLink=`<a class="sub-link all" data-route="${allDataRoute}" href="${allHref}"><span>All ${esc(lvl)}</span><span class="n">${count}</span></a>`;
    h+=`<div class="lvl" data-lvl="${modKey}:${lvl}"><button class="lvl-head" data-lvl-toggle="${modKey}:${lvl}">
          <span>${esc(lvl)}</span><span class="n">${count}</span><span class="chev">&#9656;</span></button>
        <div class="lvl-body"><div class="mod-list">${allLink}${links}</div></div></div>`;
  }
  return h;
}
function trainerModBlock(kind,label,modules){
  const links=modules.map(m=>
    `<a class="sub-link" data-route="${kind}/${encodeURIComponent(m.key)}" href="#${kind}/${encodeURIComponent(m.key)}">
       <span>${esc(m.label)}</span></a>`
  ).join('');
  return `<div class="mod" data-mod="${kind}"><button class="mod-head" data-toggle="${kind}">
        <span>${esc(label)}<span class="beta-badge">BETA</span></span><span class="chev">&#9656;</span></button>
      <div class="mod-body"><div class="mod-list">
        <a class="sub-link all" data-route="${kind}" href="#${kind}"><span>Overview</span></a>
        ${links}
      </div></div></div>`;
}
// Single-topic trainer: no sub-module hub, no accordion — the whole module is one
// flat link straight into the (only) module's round list, same visual weight as
// "Lektion"/"Nouns" etc. but styled as a plain row like "All words".
function trainerFlatLink(kind,label,modKey){
  return `<a class="mod-flat-link" data-route="${kind}/${encodeURIComponent(modKey)}" href="#${kind}/${encodeURIComponent(modKey)}">
      <span>${esc(label)}<span class="beta-badge">BETA</span></span>
    </a>`;
}
function buildModules(){
  let h='';
  // Module 1: Lektion
  h+=`<div class="mod" data-mod="lektion"><button class="mod-head" data-toggle="lektion">
        <span>Lektion</span><span class="chev">&#9656;</span></button>
      <div class="mod-body"><div class="mod-list">`;
  h+=levelBlock('lektion','lektion',null);
  h+=`</div></div></div>`;
  // Modules 2-4: word types
  for(const wt of WTYPES){
    const totalN=DATA.filter(r=>r.wt===wt.key).length;
    h+=`<div class="mod" data-mod="${wt.route}"><button class="mod-head" data-toggle="${wt.route}">
          <span>${esc(wt.label)}</span><span class="chev">&#9656;</span></button>
        <div class="mod-body"><div class="mod-list">
          <a class="sub-link all" data-route="${wt.route}/all" href="#${wt.route}/all"><span>All ${esc(wt.label)}</span><span class="n">${totalN}</span></a>`;
    h+=levelBlock(wt.route,wt.route,wt.key);
    h+=`</div></div></div>`;
  }
  // Modules 5-7: trainers (same BETA badge, hidden if no data yet)
  if(PREP_MODULES.length) h+=trainerModBlock('prep','Prepositions Trainer',PREP_MODULES);
  if(CONJ_MODULES.length) h+=trainerModBlock('conj','Conjunctions Trainer',CONJ_MODULES);
  if(VERBCASE_EXERCISES.length) h+=trainerFlatLink('verbcase','Dativ-Akkusativ Word Order Trainer','main');
  modulesEl.innerHTML=h;
  modulesEl.querySelectorAll('.mod-head').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const mod=btn.closest('.mod'); const isOpen=mod.classList.contains('open');
      modulesEl.querySelectorAll('.mod.open').forEach(m=>m.classList.remove('open'));
      if(!isOpen) mod.classList.add('open');
    });
  });
  modulesEl.querySelectorAll('.lvl-head').forEach(btn=>{
    btn.addEventListener('click',(e)=>{
      e.stopPropagation();
      const lvl=btn.closest('.lvl'); const isOpen=lvl.classList.contains('open');
      const mod=btn.closest('.mod');
      mod.querySelectorAll('.lvl.open').forEach(l=>l.classList.remove('open'));
      if(!isOpen) lvl.classList.add('open');
    });
  });
}
buildModules();

function openDrawer(o){drawer.classList.toggle('open',o);overlay.classList.toggle('open',o)}
$('#burger').onclick=()=>openDrawer(!drawer.classList.contains('open'));
overlay.onclick=()=>openDrawer(false);

function markActive(){
  const h=decodeURIComponent(location.hash);
  document.querySelectorAll('.sub-link,.nav-home,.mod-flat-link').forEach(a=>a.classList.remove('active'));
  if(h===''||h==='#/'||h==='#'){ navRootEl.querySelector('.nav-home[href="#/"]').classList.add('active'); return; }
  const route=h.replace(/^#/,'');
  const el=modulesEl.querySelector(`[data-route="${CSS.escape(route)}"]`);
  if(el){
    el.classList.add('active');
    const mod=el.closest('.mod');
    if(mod){
      modulesEl.querySelectorAll('.mod.open').forEach(m=>m!==mod&&m.classList.remove('open'));
      mod.classList.add('open');
    }
    const lvl=el.closest('.lvl');
    if(lvl){
      mod.querySelectorAll('.lvl.open').forEach(l=>l!==lvl&&l.classList.remove('open'));
      lvl.classList.add('open');
    }
    return;
  }
  // single-topic trainers (flat links): any sub-route (verbcase/1, verbcase/2...)
  // should still highlight the one flat drawer link for that trainer.
  const flatKind=route.split('/')[0];
  const flat=modulesEl.querySelector(`.mod-flat-link[data-route^="${CSS.escape(flatKind)}/"]`);
  if(flat) flat.classList.add('active');
}

/* ---------- TTS ---------- */
let DEVOICE=null;
function pickVoice(){const v=speechSynthesis.getVoices();DEVOICE=v.find(x=>/de(-|_)?/i.test(x.lang))||null}
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';if(DEVOICE)u.voice=DEVOICE;u.rate=.9;speechSynthesis.speak(u)}
document.addEventListener('click',e=>{const b=e.target.closest('.spk');if(b)say(b.dataset.say)});

/* ---------- card ---------- */
function card(r){
  const g=gc(r.article), sayTxt=(r.article?r.article+' ':'')+r.word;
  const img=r.src?`<img class="thumb" loading="lazy" src="${esc(r.src)}" alt="" onerror="this.outerHTML='<div class=&quot;ph ${g}&quot;>${esc(r.article||r.word.slice(0,1))}</div>'">`
                 :`<div class="ph ${g}">${esc(r.article||r.word.slice(0,1))}</div>`;
  const art=r.article?`<span class="art">${esc(r.article)}</span> `:'';
  return `<div class="card ${g}">${img}<div class="body">
    <div class="wrow"><div class="word ${g}">${art}${esc(r.word)}</div>
      <button class="spk" data-say="${esc(sayTxt)}" title="Aussprache">&#128266;</button></div>
    <div class="tr">${esc(r.tr)}</div>${r.es?`<div class="es">${esc(r.es)}</div>`:''}
    <div class="tags"><span class="lek">${esc(r.lek)}</span><span class="wt ${esc(r.wt)}">${esc(r.wt)}</span></div>
  </div></div>`;
}
function gridHTML(rows){return '<div class="grid">'+rows.map(card).join('')+'</div>'}
function empty(){return '<div class="empty">No words match.</div>'}

/* ---------- filter/sort ---------- */
let state={q:'',sort:'lek_new'};
function filterSort(rows){
  const term=state.q.trim().toLowerCase();
  let r=rows.filter(x=>!term||(x.word+' '+x.tr+' '+(x.es||'')).toLowerCase().includes(term));
  r.sort((a,b)=> state.sort==='az'?a.word.localeCompare(b.word)
              : state.sort==='lek_old'?(b.lekRank-a.lekRank||a.word.localeCompare(b.word))
              : (a.lekRank-b.lekRank||a.word.localeCompare(b.word)));
  return r;
}

/* ---------- views ---------- */
function renderHome(){
  controls.style.display='flex'; titleEl.textContent=SITE_TITLE; subEl.textContent=SITE_SUB; subEl.style.display='';
  const rows=filterSort(DATA); countEl.textContent=rows.length+' words';
  if(state.sort==='az'){out.innerHTML=gridHTML(rows)||empty();return}
  let cur=null,h='';
  for(const r of rows){if(r.lek!==cur){if(cur!==null)h+='</div>';cur=r.lek;h+=`<h2 class="grp">${esc(cur)}</h2><div class="grid">`}h+=card(r)}
  if(cur!==null)h+='</div>'; out.innerHTML=h||empty();
}
function renderLesson(lek){
  controls.style.display='flex'; titleEl.textContent='Lektion '+lek; subEl.style.display='none';
  const all=DATA.filter(r=>r.lek===lek); const rows=filterSort(all); countEl.textContent=rows.length+' words';
  const nounCount=all.filter(r=>r.wt==='Noun').length;
  const artBtn=nounCount>1?`<a class="btn amber" href="#artikel/lektion/${encodeURIComponent(lek)}">&#127919; Der, Die oder Das</a>`:'';
  out.innerHTML=`<div class="page-head"><h2>${esc(lek)}</h2>
    <a class="btn primary" href="#quiz/lektion/${encodeURIComponent(lek)}">&#9654; Quiz</a>
    ${artBtn}
    <a class="btn ghost" href="#/">All words</a></div>`+(gridHTML(rows)||empty());
}
function renderLektionLevel(lvl){
  controls.style.display='flex'; titleEl.textContent='Lektion '+lvl; subEl.style.display='none';
  const lessonsInLvl=LESSONS.filter(l=>levelOf(l)===lvl);
  const all=DATA.filter(r=>lessonsInLvl.includes(r.lek)); const rows=filterSort(all); countEl.textContent=rows.length+' words';
  const nounCount=all.filter(r=>r.wt==='Noun').length;
  const scope=`lektion/level/${encodeURIComponent(lvl)}`;

/* ---------- scope helpers (shared by quiz + artikel trainer) ----------
   scope string forms:
     "lektion/<lek>"              -> one lesson, all types
     "lektion/level/<LVL>"        -> one level, all lessons, all types
     "<typeroute>/all"            -> one type, all lessons
     "<typeroute>/level/<LVL>"    -> one type, one level
     "<typeroute>/<lek>"          -> one type, one lesson                                    */
function parseScope(scopeStr){
  const parts=scopeStr.split('/'); const head=parts[0];
  if(head==='lektion'){
    if(parts[1]==='level') return {lek:null, lvl:decodeURIComponent(parts[2]), wt:null};
    return {lek:decodeURIComponent(parts[1]), lvl:null, wt:null};
  }
  const wt=WTYPES.find(w=>w.route===head);
  if(wt){
    if(parts[1]==='all') return {lek:null, lvl:null, wt:wt.key};
    if(parts[1]==='level') return {lek:null, lvl:decodeURIComponent(parts[2]), wt:wt.key};
    return {lek:decodeURIComponent(parts[1]), lvl:null, wt:wt.key};
  }
  return {lek:null, lvl:null, wt:null};
}
function scopePool(scopeStr){
  const {lek,lvl,wt}=parseScope(scopeStr);
  return DATA.filter(r=>(!lek||r.lek===lek)&&(!lvl||levelOf(r.lek)===lvl)&&(!wt||r.wt===wt));
}
function scopeLabel(scopeStr){
  const {lek,lvl,wt}=parseScope(scopeStr);
  const wtLabel=wt?(WTYPES.find(w=>w.key===wt)||{}).label:null;
  const place=lek||lvl;
  if(place&&wtLabel) return wtLabel+' · '+place;
  if(place) return place;
  if(wtLabel) return 'All '+wtLabel;
  return 'All words';
}
function scopeBackHref(scopeStr){
  const {lek,lvl,wt}=parseScope(scopeStr);
  if(wt) return '#'+WTYPES.find(w=>w.key===wt).route+'/'+(lvl?'level/'+encodeURIComponent(lvl):lek?encodeURIComponent(lek):'all');
  if(lvl) return '#lektion/level/'+encodeURIComponent(lvl);
  if(lek) return '#lektion/'+encodeURIComponent(lek);
  return '#/';
}

      ${r.src?`<img class="qimg" src="${esc(r.src)}" alt="" onerror="this.style.display='none'">`:''}
      <div class="qen">${esc(r.tr)}</div>${r.es?`<div class="qes">${esc(r.es)}</div>`:''}</div>`:'';
  const btn=quiz.revealed
     ?`<div class="grade-row">
         <button class="btn grade-no" id="gradeNo">&#10007; Falsch</button>
         <button class="btn grade-ok" id="gradeOk">&#10003; Richtig</button>
       </div>`
     :`<button class="btn primary" id="reveal">Antwort zeigen</button>`;
  out.innerHTML=`<div class="quiz-wrap">
    <div class="quiz-top"><span class="progress">${quiz.pos+1} / ${quiz.order.length} &middot; ${quiz.correct}&#10003; ${quiz.incorrect}&#10007;</span>
      <a class="btn ghost" href="${backHref}" style="padding:6px 12px">Exit</a></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="qcard ${g}">
      <span class="wt ${esc(r.wt)}">${esc(r.wt)}</span>
      <div class="qword ${g}">${r.article?'<span>'+esc(r.article)+'</span> ':''}${esc(r.word)}
        <button class="spk" data-say="${esc(sayTxt)}">&#128266;</button></div>
      <div class="qhint">${quiz.revealed?'Did you get it right?':'Was bedeutet das? — think, then reveal'}</div>
      ${answer}
      <div class="qbtns">${btn}</div>
    </div></div>`;
  if(quiz.revealed){ $('#gradeOk').onclick=()=>gradeQuiz(true); $('#gradeNo').onclick=()=>gradeQuiz(false); }
  else $('#reveal').onclick=revealQuiz;
}
function revealQuiz(){quiz.revealed=true;renderQuiz(quiz.scope)}
function gradeQuiz(ok){ if(ok) quiz.correct++; else quiz.incorrect++; nextQuiz(); }
function nextQuiz(){quiz.pos++;quiz.revealed=false;renderQuiz(quiz.scope)}
document.addEventListener('keydown',e=>{ if(location.hash.indexOf('#quiz/')!==0)return;
  if(!quiz||quiz.pos>=quiz.order.length)return;
  if(!quiz.revealed && (e.code==='Space'||e.code==='Enter')){e.preventDefault(); revealQuiz();}
  else if(quiz.revealed){
    if(e.key==='ArrowRight'||e.code==='Enter'){e.preventDefault(); gradeQuiz(true);}
    else if(e.key==='ArrowLeft'){e.preventDefault(); gradeQuiz(false);}

});
